<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>{% block title %}Заявки{% endblock %} | МойСайт</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: Arial, sans-serif; line-height: 1.6; color: #242938; background: #f5f6fa; }
        .container { width: 90%; max-width: 1000px; margin: 0 auto; }
        header, footer { background: #fff; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 20px 0; }
        .logo { color: #4054c7; font-size: 24px; font-weight: 700; text-decoration: none; }
        nav { display: flex; flex-wrap: wrap; gap: 20px; }
        nav a { color: #242938; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { flex: 1; }
        .page { max-width: 820px; padding: 36px 0 56px; }
        .back { color: #4054c7; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        h1 { margin: 20px 0 8px; font-size: clamp(28px, 5vw, 38px); line-height: 1.25; overflow-wrap: anywhere; }
        h2 { margin: 0 0 12px; font-size: 23px; line-height: 1.35; overflow-wrap: anywhere; }
        p { margin: 0; }
        .intro { margin: 0 0 24px; color: #555d70; }
        .steps { margin: 20px 0; font-size: 14px; color: #555d70; }
        .form-card, .request-card { padding: 30px; border: 1px solid #e3e6ee; border-radius: 12px; background: #fff; }
        .note { margin: 0 0 22px; font-size: 14px; color: #555d70; }
        .field { min-width: 0; margin-bottom: 22px; }
        .field > label { display: block; margin-bottom: 7px; font-weight: 700; }
        .required { color: #b42318; }
        input:not([type="hidden"]):not([type="checkbox"]), textarea, select { display: block; width: 100%; padding: 12px; border: 1px solid #aeb6c5; border-radius: 8px; background: #fff; color: #242938; font: inherit; }
        textarea { resize: vertical; min-height: 112px; }
        input::placeholder, textarea::placeholder { color: #646d7c; opacity: 1; }
        input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #4054c7; outline-offset: 2px; }
        a:focus-visible, button:focus-visible { outline: 3px solid #4054c7; outline-offset: 4px; }
        [aria-invalid="true"] { border-color: #b42318 !important; }
        .help { margin: 6px 0 0; color: #555d70; font-size: 13px; }
        .errorlist { margin: 6px 0 0; padding: 0; list-style: none; color: #b42318; font-size: 14px; }
        .alert { margin: 0 0 20px; padding: 14px 16px; border-radius: 8px; background: #eef2ff; overflow-wrap: anywhere; }
        .alert.success { color: #166534; background: #effaf2; border: 1px solid #add8b9; }
        .alert.error { color: #9e231b; background: #fff1f0; border: 1px solid #e5b0aa; }
        .alert.info { color: #33488d; border: 1px solid #c4ceeb; }
        .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 24px; }
        .button { display: inline-block; padding: 12px 22px; border: 1px solid transparent; border-radius: 8px; background: #4054c7; color: #fff; font: inherit; font-weight: 700; line-height: 1.4; text-align: center; text-decoration: none; cursor: pointer; }
        .button:hover { background: #30419f; }
        .button.secondary { color: #4054c7; background: #fff; border-color: #aeb8e6; }
        .button.secondary:hover { background: #eef2ff; }
        .cancel { color: #555d70; text-decoration: none; }
        .cancel:hover { text-decoration: underline; }
        .card-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .meta { color: #555d70; font-size: 13px; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 100px; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .badge.draft { color: #7c4a08; background: #fff3d7; }
        .badge.confirmed { color: #166534; background: #e9f6ec; }
        .details { margin: 26px 0 0; }
        .details > div { padding: 18px 0; border-top: 1px solid #edf0f5; }
        .details dt { font-size: 13px; font-weight: 700; color: #555d70; margin-bottom: 6px; }
        .details dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .confirm-panel { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e3e6ee; }
        .check-label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
        .check-label input { width: 18px; height: 18px; margin: 4px 0 0; flex: 0 0 18px; accent-color: #4054c7; }
        .confirm-panel .button { margin-top: 16px; }
        .session-note { margin-top: 22px; color: #555d70; font-size: 13px; }
        .cards { display: grid; gap: 18px; margin-top: 24px; }
        .cards h2 { margin-top: 14px; }
        .card-summary { color: #555d70; overflow-wrap: anywhere; }
        .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 26px; }
        footer { padding: 20px; text-align: center; color: #555d70; }
        @media (max-width: 640px) {
            .header-inner { flex-direction: column; }
            nav { justify-content: center; gap: 14px; }
            .page { padding: 26px 0 40px; }
            .form-card, .request-card { padding: 22px 18px; }
            .actions { flex-direction: column; align-items: stretch; text-align: center; }
            .confirm-panel .button { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a class="logo" href="{% url 'frontend:home' %}">МойСайт</a>
            <nav aria-label="Основная навигация">
                <a href="{% url 'frontend:home' %}">Главная</a>
                <a href="{% url 'frontend:business_request' %}">Описать задачу</a>
                <a href="{% url 'frontend:request_list' %}">Мои заявки</a>
            </nav>
        </div>
    </header>
    <main class="container page">
        {% for message in messages %}
            <div class="alert {{ message.tags }}" role="status">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <footer><p>&copy; {% now "Y" %} МойСайт</p></footer>
</body>
</html>
