{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аккаунт{% endblock %} | МойСайт</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #242938;
            background: #f5f6fa;
        }
        a { color: #4054c7; text-underline-offset: 3px; }
        button, input, select, textarea { font: inherit; }
        a:focus-visible, button:focus-visible {
            outline: 3px solid #4054c7;
            outline-offset: 4px;
        }
        .container { width: min(1000px, 90%); margin: 0 auto; }
        .site-header { background: #fff; border-bottom: 1px solid #e3e6ee; }
        .header-inner {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 0;
        }
        .logo { color: #4054c7; font-size: 24px; font-weight: 700; text-decoration: none; }
        .header-link { color: #555d70; text-decoration: none; font-size: 14px; }
        .header-link:hover { color: #4054c7; text-decoration: underline; }
        main { flex: 1; padding: 44px 0 60px; }
        .auth-shell { max-width: 520px; margin: 0 auto; }
        .wide-shell { max-width: 840px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 18px; font-size: 14px; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .auth-card {
            padding: 32px;
            background: #fff;
            border: 1px solid #e3e6ee;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(36, 41, 56, .045);
        }
        .eyebrow {
            margin: 0 0 12px;
            color: #4054c7;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 32px); line-height: 1.25; overflow-wrap: anywhere; }
        h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.35; }
        p { margin: 0; }
        .subtitle { margin: 0 0 24px; color: #555d70; }
        .role-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 5px;
            margin-bottom: 26px;
            border-radius: 10px;
            background: #f0f2f8;
        }
        .role-switch a {
            min-width: 0;
            padding: 9px 8px;
            text-align: center;
            color: #555d70;
            text-decoration: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
        }
        .role-switch a:hover { background: #e5e9f8; }
        .role-switch a[aria-current="page"] {
            color: #4054c7;
            background: #fff;
            box-shadow: 0 1px 4px rgba(36, 41, 56, .08);
        }
        .field { min-width: 0; margin-bottom: 20px; }
        .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 7px; }
        .required { color: #b42318; }
        .field input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),
        .field textarea, .field select {
            display: block;
            width: 100%;
            max-width: 100%;
            min-height: 48px;
            padding: 11px 13px;
            border: 1px solid #b4bdce;
            border-radius: 8px;
            color: #242938;
            background: #fff;
            font-size: 16px;
            line-height: 1.5;
        }
        .field input[type="checkbox"], .field input[type="radio"] {
            width: 18px; height: 18px; accent-color: #4054c7;
        }
        .field textarea { resize: vertical; }
        .field input:focus, .field textarea:focus, .field select:focus {
            outline: 2px solid #4054c7;
            outline-offset: 2px;
        }
        .field [aria-invalid="true"], .field.has-errors input { border-color: #b42318; }
        .helptext { margin-top: 7px; color: #62697a; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
        .helptext ul { margin: 6px 0 0; padding-left: 18px; }
        .helptext li + li { margin-top: 3px; }
        .errorlist { margin: 7px 0 0; padding: 0; list-style: none; color: #b42318; font-size: 13px; }
        .notice { padding: 13px 15px; margin-bottom: 20px; background: #eef1ff; color: #3346a7; border: 1px solid #d7defc; border-radius: 8px; overflow-wrap: anywhere; }
        .notice.error { background: #fff1f0; color: #9e231b; border-color: #edc4bf; }
        .notice.success { background: #effaf2; color: #166534; border-color: #bdddc6; }
        .notice .errorlist { margin-top: 6px; }
        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            padding: 11px 20px;
            border: 1px solid #4054c7;
            border-radius: 8px;
            background: #4054c7;
            color: #fff;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .button:hover { background: #30419f; border-color: #30419f; }
        .button-full { width: 100%; }
        .button-secondary { color: #4054c7; background: #fff; }
        .button-secondary:hover { color: #30419f; background: #eef1ff; }
        .auth-bottom { margin-top: 24px; padding-top: 22px; border-top: 1px solid #e8ebf2; text-align: center; font-size: 14px; color: #555d70; }
        .auth-bottom a { font-weight: 700; }
        .page-note { margin-top: 20px; text-align: center; font-size: 13px; color: #62697a; }
        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 26px; }
        .role-card { display: flex; flex-direction: column; }
        .role-card p { margin-bottom: 24px; color: #555d70; }
        .role-card .role-actions { margin-top: auto; }
        .role-actions { display: grid; gap: 10px; }
        .account-info { margin: 24px 0; padding: 18px; background: #f5f6fa; border-radius: 10px; overflow-wrap: anywhere; }
        .account-info dt { color: #62697a; font-size: 13px; }
        .account-info dd { margin: 4px 0 0; font-weight: 700; }
        .account-info dd + dt { margin-top: 14px; }
        .site-footer { padding: 20px; background: #fff; border-top: 1px solid #e3e6ee; text-align: center; color: #62697a; font-size: 13px; }
        @media (max-width: 640px) {
            main { padding: 26px 0 40px; }
            .auth-card { padding: 24px 20px; border-radius: 12px; }
            .role-grid { grid-template-columns: 1fr; }
            .header-inner { min-height: 72px; gap: 12px; }
        }
        @media (max-width: 360px) {
            .auth-card { padding: 22px 16px; }
            .role-switch a { font-size: 13px; padding-left: 4px; padding-right: 4px; }
        }
    </style>
</head>
<body>
{% language "ru" %}
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="{% url 'frontend:home' %}">МойСайт</a>
            <a class="header-link" href="{% url 'frontend:home' %}">На главную →</a>
        </div>
    </header>
    <main>
        <div class="container">
            {% if messages %}
                <div class="auth-shell">
                    {% for message in messages %}
                        <div class="notice {{ message.tags }}" role="status">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="site-footer">&copy; {% now "Y" %} МойСайт</footer>
{% endlanguage %}
</body>
</html>
